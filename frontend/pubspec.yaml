# Aquest fitxer és la configuració principal del projecte Flutter.
# Serveix per definir l’entorn de treball, les llibreries que necessita l’aplicació,
# les eines de desenvolupament i els recursos visuals o fitxers que s’han d’incloure al projecte.

name: cims
description: Frontend multiplataforma de CiMS per consultar cims, registrar ascensions i gestionar el progrés de l'usuari.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  auto_route: ^11.1.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.1
  flutter_secure_storage: ^10.0.0
  google_maps_flutter: ^2.14.2
  collection: ^1.19.1
  image_picker: ^1.2.2
  image_picker_for_web: ^3.1.1
  flutter_image_compress: ^2.4.0
  material_symbols_icons: ^4.2928.1
  geolocator: ^14.0.2
  geolocator_web: ^4.1.3
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^10.5.0
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/cims_logo.svg
    - assets/images/cims_logo_1024.png
    - assets/images/montana_0001.png

# Configuració per al paquet `flutter_launcher_icons`.
# Genera els icons del launcher Android a partir del logo en PNG. La imatge base
# (`image_path`) s'usa per al fallback legacy (Android 7 i anteriors), mentre que
# l'adaptive icon (Android 8+) separa fons i primer pla per evitar que el
# màscara circular del sistema talli el logo.
# Per regenerar: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/cims_logo_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/cims_logo_1024_padded.png"
  adaptive_icon_monochrome: "assets/images/cims_logo_1024_padded.png"