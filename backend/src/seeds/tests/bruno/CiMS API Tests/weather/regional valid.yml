info:
  name: regional valid
  type: http
  seq: 7

# Nota: la data de la query string s'ha d'actualitzar manualment a un
# valor dins de les properes 240 hores. Si queda enrere o més enllà de
# l'horitzó de Google, l'endpoint retorna 404 perquè no hi ha previsió.
http:
  method: GET
  url: "{{base_url}}/api/regions/1/weather/summary?date=2026-05-13"
  headers:
    - name: Authorization
      value: Bearer {{token_valid}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
